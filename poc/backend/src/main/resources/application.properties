spring.application.name=fljotavik-backend

# ── Server ─────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── Datasource ─────────────────────────────────────────────────
# Values come from environment variables in Docker; defaults are
# convenient for running `./mvnw spring-boot:run` against the
# fljotavik-db container exposed on localhost:5432.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fljotavik}
spring.datasource.username=${DB_USER:fljotavik}
spring.datasource.password=${DB_PASSWORD:fljotavik}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────
# `validate` because the schema is owned by db/schema.sql, loaded by
# Postgres on first startup. Hibernate verifies mappings match; it
# must never create or alter tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Actuator ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ── Inference service ──────────────────────────────────────────
# Base URL for the Python YOLO inference container. The backend proxies
# its snapshots/MJPEG streams and consumes its detection SSE feed from here.
fljotavik.inference.base-url=${INFERENCE_BASE_URL:http://fljotavik-inference:8084}

# ── Detection debounce ────────────────────────────────────────
# A run of same-class detections on the same camera is collapsed into a
# single persisted row. A class is considered "ended" when no new frame has
# fired it for debounce-window-ms milliseconds.
fljotavik.detection.debounce-window-ms=3000
fljotavik.detection.flush-interval-ms=500

# ── Live AIS (Datalastic) ──────────────────────────────────────
# Used by VesselsController for the Fleet tab. Empty key → controller
# falls back to the Samgöngustofa registry split (still useful demo).
datalastic.api-key=${DATALASTIC_API_KEY:}
harbour.lat=${HARBOUR_LAT:66.07}
harbour.lon=${HARBOUR_LON:-23.13}

# ── OpenAPI / SpringDoc ────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
