<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hafnarvaktin · Sundahöfn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="head">
    <h1 class="title">Hafnarvaktin</h1>
    <p class="subtitle">Harbour&nbsp;watch <span class="sep">·</span> Sundahöfn,&nbsp;Ísafjörður <span class="sep">·</span> Westfjords,&nbsp;Iceland</p>
  </header>

  <main class="stage">
    <div class="live"><span class="live__pulse" aria-hidden="true"></span>Live</div>

    <figure class="frame">
      <img class="frame__img is-active" data-cam="0" src="/api/v1/cameras/9/stream.mjpg" alt="Sundahöfn North — live annotated feed">
      <img class="frame__img" data-cam="1" src="/api/v1/cameras/6/stream.mjpg" alt="Sundahöfn South — live annotated feed">
    </figure>

    <div class="switch">
      <label class="toggle-container">
        <input class="toggle-input" id="cam-toggle" type="checkbox" aria-label="Switch camera — North / South">
        <div class="toggle-handle-wrapper">
          <div class="toggle-handle">
            <div class="toggle-handle-knob"></div>
            <div class="toggle-handle-bar-wrapper">
              <div class="toggle-handle-bar"></div>
            </div>
          </div>
        </div>
        <div class="toggle-base">
          <div class="toggle-base-inside"></div>
        </div>
      </label>
    </div>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
